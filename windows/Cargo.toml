[package]
name = "aion2-meter-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/lucashm/daevalog"
description = "Daevalog for Windows: the in-game widgets and the app window"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# None of these dependencies enter the Linux desktop build.
[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Threading", "Win32_Security"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }
